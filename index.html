<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Generator App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 15px;
    width: 420px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h2 {
    margin-bottom: 15px;
}

input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

#generateBtn {
    background: #2a5298;
    color: white;
}

#downloadBtn {
    background: green;
    color: white;
    display: none;
}

#qrImage {
    margin-top: 15px;
    width: 200px;
}

.history {
    margin-top: 20px;
    text-align: left;
    max-height: 200px;
    overflow-y: auto;
}

.history-item {
    border-bottom: 1px solid #ddd;
    padding: 8px 0;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <h2>QR Code Generator 🚀</h2>

    <input type="text" id="text" placeholder="Enter URL or Text">

    <br>

    <button id="generateBtn" onclick="generateQR()">Generate</button>
    <button id="downloadBtn" onclick="downloadQR()">Download</button>

    <br>

    <img id="qrImage"/>

    <div class="history">
        <h3>History</h3>

        <button onclick="clearHistory()" style="background:red;color:white;">
            Clear History 🗑️
        </button>

        <div id="historyList"></div>
    </div>

</div>

<script>
let currentQR = "";

// 🚀 Generate QR
async function generateQR() {
    let text = document.getElementById("text").value;

    if (!text) {
        alert("Enter text or URL");
        return;
    }

    try {
        let res = await fetch("https://of7jvk0lnb.execute-api.ap-south-1.amazonaws.com/qr-stage/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text })
        });

        let data = await res.json();

        let result = typeof data.body === "string" ? JSON.parse(data.body) : data;

        currentQR = result.imageUrl || result.url;

        if (!currentQR) {
            alert("QR generation failed");
            return;
        }

        document.getElementById("qrImage").src = currentQR;
        document.getElementById("downloadBtn").style.display = "inline-block";

        saveHistory(text, currentQR);
        loadHistory();

    } catch (error) {
        console.error(error);
        alert("Something went wrong");
    }
}

// 📥 Download QR
function downloadQR() {
    if (!currentQR) return;

    let a = document.createElement("a");
    a.href = currentQR;
    a.download = "qr-code.png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

// 🕒 Save History
function saveHistory(text, url) {
    let history = JSON.parse(localStorage.getItem("qrHistory")) || [];

    history.push({
        text: text,
        url: url,
        time: new Date().toLocaleString()
    });

    localStorage.setItem("qrHistory", JSON.stringify(history));
}

// 📜 Load History
function loadHistory() {
    let history = JSON.parse(localStorage.getItem("qrHistory")) || [];

    let div = document.getElementById("historyList");
    div.innerHTML = "";

    if (history.length === 0) {
        div.innerHTML = "<p>No history yet</p>";
        return;
    }

    history.slice().reverse().forEach(item => {
        div.innerHTML += `
            <div class="history-item">
                <b>${item.text}</b><br>
                <img src="${item.url}" width="80"><br>
                <small>${item.time}</small>
            </div>
        `;
    });
}

// 🗑️ Clear History
function clearHistory() {
    let confirmClear = confirm("Are you sure you want to clear history?");

    if (confirmClear) {
        localStorage.removeItem("qrHistory");
        loadHistory();
    }
}

// auto load history
window.onload = loadHistory;
</script>

</body>
</html>
